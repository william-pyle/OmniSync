[workspace]
members = ["crates/omnisync-core", "crates/omnisync-windows", "crates/omnisync-shell", "crates/omnisync-setup", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.98"
publish = false

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
windows = { version = "=0.61.3", features = ["Networking_Connectivity", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_WinRT", "Win32_System_Memory", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
